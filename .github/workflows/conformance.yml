name: fapi-conformance

# FAPI 2.0 Security Profile conformance — two layers:
#   Layer 1 (in-repo): `npm run test:conformance` drives the AS over HTTP and
#     asserts FAPI2 SP behaviour. No Docker / no external suite — runs anywhere.
#   Layer 2 (external): the OpenID Conformance Suite from PREBUILT images
#     (pulled, NOT built here) — built once by conformance-image.yml. CI runners
#     (have docker) use compose; the devcontainer sandbox (no docker) uses k3s
#     via deploy/conformance/run-local.sh.
#
# GATED: AS protocol endpoints land in P1. Manual-only until P3; then add
# push/PR triggers and finalize deploy/conformance/. Layer 1 already runs and is
# RED by design until the endpoints exist.
on:
  workflow_dispatch:
    inputs:
      issuer:
        description: "Issuer URL the suite should test"
        default: "http://localhost:3000"

permissions:
  contents: read
  packages: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authserver
          POSTGRES_USER: authserver
          POSTGRES_PASSWORD: conformance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authserver"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://authserver:conformance@localhost:5432/authserver
      ISSUER: ${{ inputs.issuer }}
      SUITE_URL: https://localhost:8443
      CONFORMANCE_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/conformance-suite-server:pinned
      CONFORMANCE_HTTPD_IMAGE: ghcr.io/${{ github.repository_owner }}/conformance-suite-httpd:pinned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci

      # Layer 1 — in-repo FAPI 2.0 SP conformance (no Docker, no external suite).
      # Drives the AS directly and asserts FAPI2 SP behaviour. RED until P1
      # implements the endpoints; this is the fast, always-runnable gate.
      # continue-on-error pre-P1 so the run still exercises Layer 2 (suite boot).
      # TODO(P1): drop continue-on-error to make this a hard gate.
      - name: In-repo FAPI 2.0 SP conformance
        continue-on-error: true
        run: npm run test:conformance

      - run: npm run build
      - name: Apply migrations
        run: npm run migrate
      - name: Start AS
        run: |
          node --max-old-space-size=256 dist/index.js &
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done

      # Suite from prebuilt images — pull only, no build.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start conformance suite (prebuilt)
        run: docker compose -f deploy/conformance/docker-compose.yml up -d --pull always
      - name: Wait for suite to be ready
        run: |
          for _ in $(seq 1 60); do
            curl -ksf --connect-timeout 5 --max-time 10 https://localhost:8443/api/runner/available \
              && { echo; echo "suite ready"; break; }
            sleep 3
          done
          docker compose -f deploy/conformance/docker-compose.yml ps
      - name: Run FAPI 2.0 SP test plan
        run: bash deploy/conformance/run-conformance.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: deploy/conformance/results/
