name: fapi-conformance

# FAPI 2.0 Security Profile conformance — two layers:
#   Layer 1 (in-repo): `npm run test:conformance` drives the AS over HTTP and
#     asserts FAPI2 SP behaviour. No Docker / no external suite — runs anywhere.
#   Layer 2 (external): the OpenID Conformance Suite from PREBUILT images
#     (pulled, NOT built here) drives the AS end-to-end. The AS + postgres run
#     in the same compose network as the suite; the AS serves https with a
#     self-signed cert the suite is configured to trust.
#
# GATED: manual (workflow_dispatch) while Layer 2 is being finalised.
on:
  workflow_dispatch:
    inputs:
      module_filter:
        description: "Optional grep -E pattern to run a subset of modules (debug)"
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      SUITE_URL: https://localhost:8443
      ISSUER: https://as:8443
      CONFORMANCE_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/conformance-suite-server:pinned
      CONFORMANCE_HTTPD_IMAGE: ghcr.io/${{ github.repository_owner }}/conformance-suite-httpd:pinned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      # Layer 1 — in-repo FAPI 2.0 SP conformance (no Docker). Green, hard gate.
      - name: In-repo FAPI 2.0 SP conformance
        run: npm run test:conformance

      # Headless browser to complete the suite's JS-based authorization callback
      # (installed here only — the AS image never ships it).
      - name: Install headless browser (Playwright chromium)
        run: |
          npm i --no-save playwright@1.48.0
          npx playwright install --with-deps chromium

      # TLS material for the AS + a truststore the suite server trusts.
      - name: Generate conformance TLS certs
        run: bash deploy/conformance/gen-certs.sh

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bring up postgres first so migrations + client seeding run before the AS.
      - name: Start postgres
        run: docker compose -f deploy/conformance/docker-compose.yml up -d --pull always postgres
      - name: Migrate + seed conformance client
        env:
          STORAGE: postgres
          DATABASE_URL: postgresql://authserver:conformance@localhost:5432/authserver
        run: |
          for _ in $(seq 1 30); do pg_isready -h localhost -U authserver && break; sleep 1; done
          npm run migrate
          npm run seed:clients -- deploy/conformance/conformance-client.json

      - name: Start AS + conformance suite
        run: docker compose -f deploy/conformance/docker-compose.yml up -d --pull always

      - name: Wait for AS and suite to be ready
        run: |
          as_ok=; suite_ok=
          for _ in $(seq 1 40); do
            curl -ksf --max-time 5 https://localhost:3000/health && { as_ok=1; break; }
            sleep 3
          done
          for _ in $(seq 1 80); do
            curl -ksf --max-time 10 https://localhost:8443/api/runner/available && { suite_ok=1; break; }
            sleep 3
          done
          echo; docker compose -f deploy/conformance/docker-compose.yml ps
          if [ -z "$as_ok" ] || [ -z "$suite_ok" ]; then
            echo "::error::AS ready=$as_ok suite ready=$suite_ok"
            docker compose -f deploy/conformance/docker-compose.yml logs --tail=200 as server
            exit 1
          fi

      - name: Run FAPI 2.0 SP test plan
        env:
          MODULE_FILTER: ${{ inputs.module_filter }}
        run: bash deploy/conformance/run-conformance.sh

      - name: Dump AS logs on failure
        if: failure()
        run: docker compose -f deploy/conformance/docker-compose.yml logs --tail=300 as server

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: deploy/conformance/results/
