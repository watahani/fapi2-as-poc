name: conformance-image

# Build the OpenID Conformance Suite images ONCE and make them available so CI
# and local runs only consume them (no per-run Gradle/Maven build). Two outputs:
#   1) GHCR push  — ghcr.io/<owner>/conformance-suite-{server,httpd}:{pinned,<ref>}
#                   (used by the CI compose path; GITHUB_TOKEN can pull these).
#   2) Artifacts  — docker-saved tarballs uploaded as workflow artifacts, so the
#                   devcontainer sandbox (no Docker, no GHCR pull creds) can
#                   `gh run download` them and `ctr import` into k3s.
#
# Build strategy: clone upstream at a pinned release and build via UPSTREAM'S
# OWN docker compose definition, with an override that names the images for us.
# This avoids hard-coding upstream's internal Dockerfile paths/build steps.
on:
  workflow_dispatch:
    inputs:
      suite_ref:
        description: "conformance-suite tag/ref to build ('auto' = latest release-v*)"
        default: "auto"
  schedule:
    - cron: "0 3 1 * *" # monthly

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  UPSTREAM: https://gitlab.com/openid/conformance-suite.git

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve owner (lowercase) and ref
        id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          ref="${{ github.event.inputs.suite_ref }}"
          if [ -z "$ref" ] || [ "$ref" = "auto" ]; then
            ref=$(git ls-remote --tags --refs "$UPSTREAM" 'release-v*' \
                  | sed 's#.*refs/tags/##' | sort -V | tail -1)
          fi
          [ -n "$ref" ] || { echo "could not resolve upstream ref" >&2; exit 1; }
          # Sanitize for use as a docker tag (no '/').
          tag=$(echo "$ref" | tr '/' '-')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building upstream ref: $ref (tag: $tag)"

      - name: Clone upstream conformance suite
        run: git clone --depth 1 --branch "${{ steps.vars.outputs.ref }}" "$UPSTREAM" suite

      - name: Inspect upstream build layout (debug)
        working-directory: suite
        run: |
          echo "::group::top-level"; ls -la; echo "::endgroup::"
          echo "::group::compose services"; docker compose config --services 2>&1 || true; echo "::endgroup::"
          echo "::group::docker-compose.yml"; cat docker-compose.yml 2>&1 || true; echo "::endgroup::"
          echo "::group::builder-compose.yml"; cat builder-compose.yml 2>&1 || echo "(none)"; echo "::endgroup::"
          echo "::group::Dockerfile"; cat Dockerfile 2>&1 || true; echo "::endgroup::"
          echo "::group::httpd/nginx dirs"; ls -la httpd nginx 2>&1 || true; echo "::endgroup::"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write image-naming override
        run: |
          P="${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/conformance-suite"
          # Upstream services are: mongodb, server, nginx (the reverse proxy on
          # :8443). We keep our downstream image name "-httpd" for the proxy.
          cat > suite/ci-images.yml <<YAML
          services:
            server:
              image: ${P}-server:${{ steps.vars.outputs.tag }}
            nginx:
              image: ${P}-httpd:${{ steps.vars.outputs.tag }}
          YAML
          cat suite/ci-images.yml

      # The server image COPYs a pre-built jar from target/; upstream produces it
      # via a separate maven "builder" (builder-compose.yml). Without this the
      # server image ships no jar and defaults to `jshell`. Run the builder if
      # present; fall back to a Maven container build of target/.
      - name: Build the conformance-suite jar (maven)
        working-directory: suite
        run: |
          if [ -f builder-compose.yml ]; then
            docker compose -f builder-compose.yml run --rm builder
          else
            docker run --rm -v "$PWD":/usr/src -w /usr/src maven:3-eclipse-temurin-17 \
              mvn -B -q clean package -DskipTests
          fi
          echo "== target/ =="; ls -la target/ 2>&1 || true

      # The compose `server` service builds ./server-dev (a DEV image that
      # volume-mounts the jar + needs a command) — not self-contained. The real
      # production server image is the ROOT Dockerfile: it COPYs the freshly
      # built target/fapi-test-suite.jar and has an env-driven ENTRYPOINT
      # (BASE_URL / MONGODB_HOST → spring.data.mongodb.uri). Build that directly.
      - name: Build server image (root Dockerfile — jar baked + entrypoint)
        working-directory: suite
        run: |
          docker build -f Dockerfile \
            -t "${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/conformance-suite-server:${{ steps.vars.outputs.tag }}" .

      # The nginx reverse proxy (:8443) is self-contained; build via compose.
      - name: Build httpd (nginx) image
        working-directory: suite
        run: docker compose -f docker-compose.yml -f ci-images.yml build nginx

      - name: Tag :pinned aliases and push to GHCR
        run: |
          P="${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/conformance-suite"
          for img in server httpd; do
            src="${P}-${img}:${{ steps.vars.outputs.tag }}"
            docker tag "$src" "${P}-${img}:pinned"
            docker push "$src"
            docker push "${P}-${img}:pinned"
          done

      - name: Export images as artifacts (for k3s import in the sandbox)
        run: |
          P="${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/conformance-suite"
          mkdir -p out
          docker save "${P}-server:pinned" | gzip > out/conformance-suite-server.tar.gz
          docker save "${P}-httpd:pinned"  | gzip > out/conformance-suite-httpd.tar.gz
          echo "${{ steps.vars.outputs.ref }}" > out/SUITE_REF.txt
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: conformance-suite-images
          path: out/
          retention-days: 7
