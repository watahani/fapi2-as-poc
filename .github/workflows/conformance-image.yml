name: conformance-image

# Build the OpenID Conformance Suite images ONCE and push to GHCR so CI and
# local runs only PULL them (no per-run Gradle build). Run rarely: manually or
# on a schedule when bumping the pinned upstream version.
on:
  workflow_dispatch:
    inputs:
      suite_ref:
        description: "conformance-suite upstream tag/ref to build"
        default: "master"
  schedule:
    - cron: "0 3 1 * *" # monthly

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/conformance-suite

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream conformance suite (GitLab)
        run: |
          git clone --depth 1 --branch "${{ inputs.suite_ref || 'master' }}" \
            https://gitlab.com/openid/conformance-suite.git suite

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TODO(P3): upstream may require a Gradle/Maven build before the image
      # build (jar into ./target). Finalize exact build steps per upstream docs.
      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: suite/server-dev
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-server:${{ inputs.suite_ref || 'master' }}

      - name: Build & push httpd image
        uses: docker/build-push-action@v6
        with:
          context: suite/nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-httpd:${{ inputs.suite_ref || 'master' }}
