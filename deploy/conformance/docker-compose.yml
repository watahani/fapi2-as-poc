# OpenID Conformance Suite from PREBUILT images (no per-run build).
#
# USE THIS ONLY ON DOCKER-CAPABLE HOSTS (CI runners, your laptop). The
# devcontainer sandbox has NO Docker daemon (k3s + containerd, no DinD) — there,
# use deploy/conformance/run-local.sh which runs the suite on k3s instead.
#
# Images are produced once by .github/workflows/conformance-image.yml and just
# pulled here. Override via CONFORMANCE_SERVER_IMAGE / CONFORMANCE_HTTPD_IMAGE.
services:
  mongodb:
    image: mongo:6.0.13
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    image: ${CONFORMANCE_SERVER_IMAGE:-ghcr.io/watahani/conformance-suite-server:pinned}
    depends_on: [mongodb]
    environment:
      MONGODB_HOST: mongodb
      # Must mirror k8s/suite.yaml: the entrypoint always wires Google/GitLab
      # OIDC admin login from these vars and Spring rejects empty client-ids,
      # so the server exits at boot (httpd then 502s) without them. devmode
      # enables local admin auth instead of external OIDC.
      JAVA_EXTRA_ARGS: "-Dfintechlabs.devmode=true -Dfintechlabs.startredir=true"
      OIDC_GOOGLE_CLIENTID: "dummy"
      OIDC_GOOGLE_SECRET: "dummy"
      OIDC_GITLAB_CLIENTID: "dummy"
      OIDC_GITLAB_SECRET: "dummy"
    restart: unless-stopped

  httpd:
    image: ${CONFORMANCE_HTTPD_IMAGE:-ghcr.io/watahani/conformance-suite-httpd:pinned}
    depends_on: [server]
    ports:
      - "8443:8443"
    restart: unless-stopped

volumes:
  mongo-data:
