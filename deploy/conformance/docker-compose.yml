# OpenID Conformance Suite + the AS under test, all on one docker network so
# the suite reaches the AS by service DNS (https://as:8443). FAPI mandates TLS,
# so the AS serves https with a self-signed cert; the suite server trusts that
# cert via a mounted truststore (certs are generated by conformance.yml /
# gen-certs.sh into ./certs).
#
# USE THIS ONLY ON DOCKER-CAPABLE HOSTS (CI runners, laptops). The devcontainer
# sandbox has NO docker daemon — there, use k8s/suite.yaml on k3s.
services:
  mongodb:
    image: mongo:6.0.13
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    image: ${CONFORMANCE_SERVER_IMAGE:-ghcr.io/watahani/conformance-suite-server:pinned}
    depends_on: [mongodb]
    environment:
      MONGODB_HOST: mongodb
      # Mirror k8s/suite.yaml: without devmode + non-empty OIDC client-ids the
      # Spring server exits at boot and httpd returns 502.
      JAVA_EXTRA_ARGS: "-Dfintechlabs.devmode=true -Dfintechlabs.startredir=true"
      OIDC_GOOGLE_CLIENTID: "dummy"
      OIDC_GOOGLE_SECRET: "dummy"
      OIDC_GITLAB_CLIENTID: "dummy"
      OIDC_GITLAB_SECRET: "dummy"
      # Trust the AS self-signed CA so the suite can call https://as:8443.
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped

  httpd:
    image: ${CONFORMANCE_HTTPD_IMAGE:-ghcr.io/watahani/conformance-suite-httpd:pinned}
    depends_on: [server]
    ports:
      - "8443:8443"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authserver
      POSTGRES_USER: authserver
      POSTGRES_PASSWORD: conformance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authserver"]
      interval: 5s
      timeout: 5s
      retries: 10

  as:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # dev (not production): conformance uses the mock PDP for auto-consent.
      NODE_ENV: development
      STORAGE: postgres
      DATABASE_URL: postgresql://authserver:conformance@postgres:5432/authserver
      ISSUER: https://as:8443
      PORT: "8443"
      PDP_KIND: mock
      # Short request_uri lifetime so the suite's "expired request_uri" module
      # completes quickly (still well under the FAPI2 600s bound).
      PAR_TTL_SEC: "25"
      TLS_CERT_FILE: /certs/as.crt
      TLS_KEY_FILE: /certs/as.key
    volumes:
      - ./certs:/certs:ro
    # Published only so CI can health-check the AS from the host; the suite
    # reaches it in-network at https://as:8443.
    ports:
      - "3000:8443"
    restart: unless-stopped

volumes:
  mongo-data:
