# OpenID Conformance Suite on Kubernetes — for the in-sandbox k3s (the
# devcontainer has NO docker daemon; k3s is the local container runtime).
#
# Images are built once by .github/workflows/conformance-image.yml. They are
# PRIVATE on GHCR and the sandbox gh token has no packages scope, so instead of
# pulling we IMPORT the workflow's tarball artifacts into k3s containerd:
#   gh run download <run-id> -n conformance-suite-images -D /tmp/cf
#   zcat /tmp/cf/conformance-suite-server.tar.gz | sudo k3s ctr images import -
#   zcat /tmp/cf/conformance-suite-httpd.tar.gz  | sudo k3s ctr images import -
# Hence imagePullPolicy: IfNotPresent (use the locally-imported image).
#
# Apply with deploy/conformance/run-local.sh.
# NOTE: in-sandbox k3s currently needs --snapshotter=fuse-overlayfs (see
# scripts/dev-cluster.sh) or the node will not register.
apiVersion: v1
kind: Namespace
metadata:
  name: conformance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: conformance
spec:
  replicas: 1
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0.13
          ports: [{ containerPort: 27017 }]
---
apiVersion: v1
kind: Service
metadata: { name: mongodb, namespace: conformance }
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: conformance
spec:
  replicas: 1
  selector: { matchLabels: { app: server } }
  template:
    metadata: { labels: { app: server } }
    spec:
      containers:
        - name: server
          # Built by conformance-image.yml, imported into k3s via ctr (above).
          image: ghcr.io/watahani/conformance-suite-server:pinned
          imagePullPolicy: IfNotPresent
          env:
            - { name: MONGODB_HOST, value: mongodb }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: server, namespace: conformance }
spec:
  selector: { app: server }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: conformance
spec:
  replicas: 1
  selector: { matchLabels: { app: httpd } }
  template:
    metadata: { labels: { app: httpd } }
    spec:
      containers:
        - name: httpd
          image: ghcr.io/watahani/conformance-suite-httpd:pinned
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8443 }]
---
apiVersion: v1
kind: Service
metadata: { name: httpd, namespace: conformance }
spec:
  selector: { app: httpd }
  ports: [{ port: 8443, targetPort: 8443 }]
