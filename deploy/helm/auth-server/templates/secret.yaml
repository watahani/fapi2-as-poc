{{- /*
  Password resolution (no credential committed to VCS):
    1. explicit .Values.secret.databasePassword (external/managed DB), else
    2. reuse the password from an existing Secret of this release (idempotent
       helm upgrade — keeps it in sync with the already-initialised PVC), else
    3. generate a random one at install time.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "auth-server.fullname" .) -}}
{{- $pw := "" -}}
{{- if .Values.secret.databasePassword -}}
{{-   $pw = .Values.secret.databasePassword -}}
{{- else if $existing -}}
{{-   if (index $existing.data "POSTGRES_PASSWORD") -}}
{{-     $pw = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{-   else -}}
{{-     $pw = randAlphaNum 24 -}}
{{-   end -}}
{{- else -}}
{{-   $pw = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-server.fullname" . }}
  labels:
    {{- include "auth-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.database.user $pw (include "auth-server.postgresHost" .) (.Values.database.port | int) .Values.database.name | quote }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
