{{- if .Values.networkPolicy.enabled }}
# Scaffold for the auth/authz separation: restrict who can talk to the AS and
# what the AS may reach (external IdP for authN, AuthZEN PDP for authZ).
# Tightened in later phases; off by default in P0.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auth-server.fullname" . }}
  labels:
    {{- include "auth-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "auth-server.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Same-namespace clients only (tighten to specific client/ingress
    # namespaces as the topology firms up).
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
  egress:
    # DNS restricted to kube-dns (prevents DNS-tunnel exfiltration).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - port: 5432
    # NOTE: P2 adds egress allowances for the external IdP (authN) and the
    # AuthZEN PDP (authZ) referenced by the auth/authz separation.
{{- end }}
